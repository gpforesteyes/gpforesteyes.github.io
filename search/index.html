<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ForestEyeSearch · onde publicar em ciências florestais</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--bg:#f6f7f5;--card:#fff;--ink:#1d2a24;--mut:#5f6b66;--line:#e2e6e3;--acc:#1f6f4a;
--c-dia:#2e7d32;--c-cap:#1565c0;--c-ass:#00897b;--c-pag:#c62828;--c-ver:#9aa3a0}
@media (prefers-color-scheme:dark){:root{--bg:#121614;--card:#1b211e;--ink:#e6ece9;--mut:#9aa8a2;--line:#2c3531;--acc:#5cc293;
--c-dia:#66bb6a;--c-cap:#64b5f6;--c-ass:#4db6ac;--c-pag:#ef5350;--c-ver:#7d8783}}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
header.top{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:16px 22px;background:#1d4a2c;color:#fff;flex-wrap:wrap}
header.top .sub{color:#d6e6dc;max-width:900px}
.upd{display:inline-block;font-size:12px;background:rgba(255,255,255,.14);padding:2px 9px;border-radius:999px;margin-bottom:6px}
.logos{display:flex;align-items:center;gap:14px}
.logos img{height:58px;width:auto;display:block}
h1{font-size:21px;margin:0 0 4px}
.sub{color:var(--mut);font-size:13px}
.wrap{display:grid;grid-template-columns:290px 1fr;gap:16px;padding:12px 22px 30px}
@media (max-width:900px){.wrap{grid-template-columns:1fr}}
aside,.card{background:var(--card);border:1px solid var(--line);border-radius:10px}
aside{padding:14px;align-self:start;position:sticky;top:10px;max-height:calc(100vh - 20px);overflow:auto}
@media (max-width:900px){aside{position:static;max-height:none}}
aside h3{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);margin:14px 0 6px}
aside h3:first-child{margin-top:0}
input[type=search],select{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--ink);font:inherit}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:3px 10px;font-size:12.5px;cursor:pointer;display:inline-flex;align-items:center;gap:5px}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.tog{display:flex;align-items:center;gap:8px;margin:5px 0;cursor:pointer;font-size:13px}
.tog input{accent-color:var(--acc);width:16px;height:16px}
.rng{display:flex;justify-content:space-between;font-size:12px;color:var(--mut)}
input[type=range]{width:100%;accent-color:var(--acc)}
button.btn{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:7px;padding:6px 10px;cursor:pointer;font:inherit;font-size:13px}
button.btn:hover{border-color:var(--acc)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:12px}
.kpi{padding:10px 12px}
.kpi b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.kpi span{color:var(--mut);font-size:12px}
.summary{padding:10px 14px;margin-bottom:12px;font-size:13.5px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
@media (max-width:1100px){.grid{grid-template-columns:1fr}}
.card h2{font-size:14px;margin:0 0 2px}
.card .hint{font-size:12px;color:var(--mut);margin-bottom:6px}
.cbox{padding:12px 14px}
.cv{position:relative;height:260px}
.cv.tall{height:330px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{position:sticky;top:0;background:var(--card);cursor:pointer;user-select:none;white-space:nowrap;font-size:12px;color:var(--mut)}
th.s::after{content:" ▾"}th.s.asc::after{content:" ▴"}
td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tbody tr{cursor:pointer}tbody tr:hover{background:var(--bg)}
.tbl{max-height:560px;overflow:auto}
.tag{display:inline-block;font-size:11.5px;padding:1px 7px;border-radius:999px;color:#fff;white-space:nowrap}
.muted{color:var(--mut)}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 14px;border-radius:8px;cursor:pointer;font:inherit}
.tabs button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-start;justify-content:center;padding:40px 14px;z-index:9;overflow:auto}
#modal .box{background:var(--card);color:var(--ink);border-radius:12px;max-width:760px;width:100%;padding:18px 20px;border:1px solid var(--line)}
#modal dl{display:grid;grid-template-columns:200px 1fr;gap:4px 12px;font-size:13px;margin:10px 0}
#modal dt{color:var(--mut)}
#modal ul{padding-left:18px;font-size:13px}
a{color:var(--acc)}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:7px 14px;border-radius:8px;font-size:13px;display:none;z-index:10}
.langs{display:flex;gap:4px;margin-left:6px}
.langs button{border:1px solid rgba(255,255,255,.45);background:transparent;color:#fff;border-radius:6px;padding:3px 8px;font:inherit;font-size:12px;cursor:pointer}
.langs button.on{background:#fff;color:#1d4a2c;border-color:#fff;font-weight:600}
.brand{font-size:26px;font-weight:700;letter-spacing:.2px;margin:2px 0 0}
.brand small{display:block;font-size:15px;font-weight:500;color:#d6e6dc;margin-top:2px}
.right{display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.logos a{display:block}
</style>
</head>

let LANG='pt';
try{const s=localStorage.getItem('fes-lang')||localStorage.getItem('lang');if(s&&I18N[s])LANG=s;else{const n=(navigator.language||'').slice(0,2);if(I18N[n])LANG=n}}catch(e){}
const T=k=>{const v=I18N[LANG][k];return v===undefined?I18N.pt[k]:v};
const TX=s=>{if(s==null)return s;if(LANG==='pt')return s;const m=String(s).match(/^Inferido do % OA do JCR 2025 \((\d+)% dos artigos em OA\)/);if(m)return I18N[LANG].txt.inf(m[1]);return I18N[LANG].txt[s]||s};
const AN=a=>((I18N[LANG].areas||{})[a]||[a])[0], AD=a=>((I18N[LANG].areas||{})[a]||[a,a])[1];
const LOC=()=>({pt:'pt-BR',es:'es-ES',en:'en-US'})[LANG];
const CL=[
 {k:'Grátis (OA diamante, sem taxa)',s:'cl.dia',w:'dia',c:'--c-dia'},
 {k:'Grátis via acordo CAPES (OA incluído)',s:'cl.cap',w:'cap',c:'--c-cap'},
 {k:'Grátis (assinatura; OA opcional pago)',s:'cl.ass',w:'ass',c:'--c-ass'},
 {k:'Paga para publicar',s:'cl.pag',w:'pag',c:'--c-pag'},
 {k:'A verificar',s:'cl.ver',w:'ver',c:'--c-ver'}];
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const clOf=k=>CL.find(c=>c.k===k)||CL[4];
const col=k=>css(clOf(k).c);
const short=k=>T(clOf(k).s);
const FREE=new Set([CL[0].k,CL[1].k,CL[2].k]),OPENFREE=new Set([CL[0].k,CL[1].k]);
const QS=['Q1','Q2','Q3','Q4','Sem JIF'];const qlab=q=>q==='Sem JIF'?T('noJif'):q;
const fmt=(n,d=0)=>n==null||n===''?'':Number(n).toLocaleString(LOC(),{minimumFractionDigits:d,maximumFractionDigits:d});
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const AREAS=D.ar.map(x=>x.a);
const APAL=['#1f6f4a','#1565c0','#8d6e63','#2e7d32','#6a1b9a','#f9a825','#c62828','#00838f','#5d4037','#ad1457'];
const J=D.j.map((d,i)=>{d.i=i;d.cl=d.cl||'A verificar';d.qq=d.q||'Sem JIF';d.jn=typeof d.jif==='number'?d.jif:(d.jif==='<0.1'?0.05:null);
 d.cats=(d.cat||'').split(';').map(s=>s.trim()).filter(Boolean);d.amap=d.am||{};d.ta=d.ta||0;d.txt=[d.n,d.ed,d.il,d.is,d.cat].join(' ').toLowerCase();return d});
function why(d){const w=clOf(d.cl).w;
 if(w==='dia')return T('why.dia');
 if(w==='cap')return T('why.cap')+(d.acd?' ('+TX(d.acd)+')':'');
 if(w==='ass')return T('why.ass')+(d.apc?T('why.assApc')(fmt(d.apc)):'');
 if(w==='pag')return d.apc?T('why.pagApc')(fmt(d.apc)):T('why.pag');
 return T('why.ver')}
const ART={};D.a.forEach(a=>(ART[a[2]]=ART[a[2]]||[]).push(a));
const S={area:'',q:'',cls:new Set(),qs:new Set(),cat:'',ed:'',qu:'',jif:0,onlyJif:false,apc:13000,apcPay:false,free:false,openFree:false,pub:false,sort:'jn',asc:false};
const $=id=>document.getElementById(id);
function chips(el,items,set,label,color,cb){el.innerHTML='';items.forEach(k=>{const b=document.createElement('span');b.className='chip'+(set.has(k)?' on':'');
 b.innerHTML=(color?'<span class="dot" style="background:'+color(k)+'"></span>':'')+esc(label?label(k):k);b.onclick=()=>{set.has(k)?set.delete(k):set.add(k);(cb||render)()};el.appendChild(b)})}
const catCount={};J.forEach(d=>d.cats.forEach(c=>catCount[c]=(catCount[c]||0)+1));
const edCount={};J.forEach(d=>{if(d.ed)edCount[d.ed]=(edCount[d.ed]||0)+1});
function fillSel(el,first,arr,val){el.innerHTML='';const o0=document.createElement('option');o0.value='';o0.textContent=first;el.appendChild(o0);
 arr.forEach(([v,t])=>{const o=document.createElement('option');o.value=v;o.textContent=t;el.appendChild(o)});el.value=val||''}
function fillSelects(){
 fillSel($('fCat'),T('f.allCat'),Object.entries(catCount).sort((a,b)=>a[0].localeCompare(b[0])).map(([c,n])=>[c,c+' ('+n+')']),S.cat);
 fillSel($('fEd'),T('f.allPub'),Object.entries(edCount).sort((a,b)=>b[1]-a[1]).map(([c,n])=>[c,c+' ('+n+')']),S.ed);
 fillSel($('fArea'),T('f.allArea'),AREAS.map(a=>[a,AN(a)]),S.area);
 fillSel($('fQu'),T('f.anyQualis'),['A1','A2','A3','A4','B1','B2','B3','B4','C'].map(x=>[x,x]),S.qu)}
function cnt(d){return S.area?(d.amap[S.area]||0):d.ta}
function filt(){const q=S.q.toLowerCase();return J.filter(d=>{
 if(q&&!d.txt.includes(q))return false;
 if(S.cls.size&&!S.cls.has(d.cl))return false;
 if(S.free&&!FREE.has(d.cl))return false;
 if(S.openFree&&!OPENFREE.has(d.cl))return false;
 if(S.qs.size&&!S.qs.has(d.qq))return false;
 if(S.cat&&!d.cats.includes(S.cat))return false;
 if(S.ed&&d.ed!==S.ed)return false;
 if(S.area&&!cnt(d))return false;
 if(S.pub&&!cnt(d))return false;
 if(S.qu&&d.qu!==S.qu)return false;
 if(S.onlyJif&&d.jn==null)return false;
 if(S.jif>0&&!(d.jn>=S.jif))return false;

 const names=new Set(F.map(d=>d.n));const yrs={};const keys=S.area?[S.area]:AREAS;
 D.a.forEach(a=>{const [ar,y,j]=a;if(!names.has(j)||!y||y<1980||y>2026||!keys.includes(ar))return;yrs[y]=yrs[y]||{};yrs[y][ar]=(yrs[y][ar]||0)+1});

 mk('cYr',{type:'line',data:{labels:ys,datasets:keys.map(k=>({label:AN(k),data:ys.map(y=>(yrs[y]||{})[k]||0),borderColor:APAL[AREAS.indexOf(k)%APAL.length],backgroundColor:APAL[AREAS.indexOf(k)%APAL.length],tension:.25,pointRadius:1.5,borderWidth:1.6}))},
